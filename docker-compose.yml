services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_CLI_VERSION: "0.147.0-alpha.6.5"
        LARK_CLI_VERSION: "1.0.85"
    image: suanagent-dev:local
    init: true
    working_dir: /workspace
    environment:
      HOME: /home/suanagent
      CODEX_HOME: /home/suanagent/.codex
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
    volumes:
      # Source is the only host bind mount. All execution happens in the image.
      - type: bind
        source: .
        target: /workspace
      # Generated state stays in Docker-managed volumes, not on host paths.
      - type: volume
        source: suanagent_experiments
        target: /workspace/experiments
      - type: volume
        source: suanagent_workspaces
        target: /workspace/workspaces
      - type: volume
        source: suanagent_codex_home
        target: /home/suanagent/.codex
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # The test suite writes executable fake CLI fixtures under /tmp.
      # Keep the directory ephemeral, but permit those controlled test commands.
      - /tmp:mode=1777,exec
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "orchestrator.cli_connectivity",
          "--config",
          "config/cli_integrations.json",
          "--strict"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["sleep", "infinity"]

volumes:
  suanagent_experiments:
  suanagent_workspaces:
  suanagent_codex_home:
